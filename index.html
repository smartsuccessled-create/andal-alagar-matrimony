<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andal Alagar Matrimony</title>
    <!-- டெலிகிராம் மினி ஆப் ஸ்டைல் மற்றும் SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --button-color: var(--tg-theme-button-color, #ff3366);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding-top: 20px;
        }
        h2 {
            color: #ff3366;
            margin-bottom: 5px;
        }
        p.tagline {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ஆண்டாள் அழகர் மேட்ரிமோனி</h2>
        <p class="tagline">உங்கள் வாழ்வின் இணையைக் கண்டறிய...</p>

        <form id="matrimonyForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">பெயர் (Full Name):</label>
                <input type="text" id="name" required placeholder="உங்கள் பெயரை உள்ளிடவும்">
            </div>

            <div class="form-group">
                <label for="gender">பாலினம் (Gender):</label>
                <select id="gender" required>
                    <option value="">-- தேர்ந்தெடுக்கவும் --</option>
                    <option value="Male">ஆண் (Male)</option>
                    <option value="Female">பெண் (Female)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">வயது (Age):</label>
                <input type="number" id="age" required placeholder="எ.கா: 25">
            </div>

            <div class="form-group">
                <label for="district">மாவட்டம் (District):</label>
                <input type="text" id="district" required placeholder="எ.கா: மதுரை / சென்னை">
            </div>

            <button type="submit" class="btn">பதிவு செய் / வரன்களைப் பார்</button>
        </form>
    </div>

    <script>
        // டெலிகிராம் மினி ஆப் ஓபன் ஆனதும் அதன் தீம் (Theme) செட்டிங்ஸை ஆட்டோமேட்டிக்காக எடுக்க
        let tg = window.Telegram.WebApp;
        tg.expand();

        function handleSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const gender = document.getElementById('gender').value;
            
            // டெலிகிராம் வைப்ரேஷன் அல்லது அலர்ட் கொடுக்க
            tg.showAlert(`வணக்கம் ${name}! உங்கள் சுயவிவரம் வெற்றிகரமாகப் பதிவு செய்யப்பட்டது.`);
            
            // தரவுகளை டெலிகிராம் பாட்டிற்கு அல்லது டேட்டாபேஸிற்கு அனுப்பும் கோடை இங்கே இணைக்கலாம்
        }
    </script>

</body>
</html>
