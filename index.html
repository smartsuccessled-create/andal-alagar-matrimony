<div class="section-box" style="border: 2px dashed #ff3366; margin-top: 20px;">
    <h3>🛠️ அட்மின் லாகின் (Admin Panel)</h3>
    <div id="adminLoginBox">
        <div class="form-group">
            <label>அட்மின் கடவுச்சொல் (Admin Password):</label>
            <input type="password" id="adminPass" placeholder="Password உள்ளிடவும்">
        </div>
        <button class="btn" onclick="checkAdminLogin()" style="background-color: #333;">Admin Login</button>
    </div>

    <div id="adminDashboard" style="display: none; margin-top: 10px;">
        <p style="color: #2e7d32; font-weight: bold; font-size: 12px;">✅ அட்மின் லாகின் வெற்றி!</p>
        <div style="background: #f1f1f1; padding: 8px; border-radius: 5px; font-size: 11px; margin-bottom: 8px;">
            <b>பதிவு செய்த மொத்த பயனர்கள்:</b> <span id="totalUsersCount">1</span><br>
            <b>சப்ஸ்கிரிப்ஷன் செய்தவர்கள்:</b> Active (VIP)
        </div>
        <button class="btn" onclick="alert('Google Sheet அல்லது Database உடன் இணைக்க வேண்டும்!')" style="background-color: #d32f2f; padding: 7px; font-size: 11px;">பயனர்கள் பட்டியலைக் காண்க (Database)</button>
    </div>
</div>

<script>
    // அட்மின் பாஸ்வேர்ட் சரிபார்க்கும் வசதி (உதாரணத்திற்கு: admin123)
    function checkAdminLogin() {
        let pass = document.getElementById('adminPass').value;
        if(pass === "admin123") {
            document.getElementById('adminLoginBox').style.display = "none";
            document.getElementById('adminDashboard').style.display = "block";
            alert("அட்மின் பேனல் திறக்கப்பட்டது!");
        } else {
            alert("தவறான கடவுச்சொல்! (Admin Password தவற십)");
        }
    }
</script>
